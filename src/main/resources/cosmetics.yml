# Every cosmetic on the server. To add one: add its model to the resource pack,
# then add an entry here (or just update the pack, new models are picked up
# automatically) and run /aconite reload.
#
# id:
#   name: Shown name
#   category: Hats & Caps        (topic in the menu, see config.yml)
#   model: aconite:id          (optional, defaults to aconite:<id>)
#   frames: [aconite:a, aconite:b]   (optional, makes it animated)
#   frame-ticks: 4             (optional, ticks per frame, 20 ticks = 1 second)

